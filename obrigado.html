<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedido | Camiseta Serviço Social</title>
<style>
body{margin:0;background:#f5efe6;color:#191715;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;max-width:620px;width:100%;padding:34px;border-radius:24px;box-shadow:0 18px 50px rgba(25,23,21,.11);text-align:center}h1{font-size:40px;line-height:1;margin:0 0 12px}.icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#eaf7ef;color:#1f7a45;font-size:32px;font-weight:900;margin:0 auto 18px}.muted{color:#716b64}.status{margin:22px 0;padding:15px;border-radius:14px;background:#f7f4ef}.btn{display:inline-block;background:#c91f2b;color:#fff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:900}.small{font-size:12px;color:#716b64;margin-top:18px;word-break:break-all}
</style>
</head>
<body><main class="card">
<div class="icon" id="icon">✓</div><h1 id="title">Recebemos seu pedido!</h1><p class="muted" id="text">Estamos verificando o pagamento.</p>
<div class="status" id="status">Aguarde um instante…</div>
<a class="btn" href="/">Voltar para a loja</a><div class="small" id="details"></div>
</main>
<script>
(async()=>{
 const p=new URLSearchParams(location.search);
 const order=p.get('order_nsu'), tx=p.get('transaction_nsu'), slug=p.get('slug');
 const status=document.getElementById('status');
 if(!order||!tx||!slug){status.textContent='Pedido recebido. Para confirmar o pagamento, consulte seu comprovante da InfinitePay.';return;}
 try{
   const r=await fetch('/api/payment-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_nsu:order,transaction_nsu:tx,slug})});
   const d=await r.json();
   if(d.paid===true){document.getElementById('title').textContent='Pagamento confirmado!';document.getElementById('text').textContent='Sua reserva foi confirmada com sucesso.';status.textContent='Pedido confirmado. A camiseta seguirá o cronograma da pré-venda.';}
   else{document.getElementById('icon').textContent='!';document.getElementById('title').textContent='Pagamento ainda não confirmado';status.textContent='Confira o status do pagamento na InfinitePay. Se você acabou de pagar, aguarde alguns instantes e atualize a página.';}
   document.getElementById('details').textContent='Pedido: '+order;
 }catch(e){status.textContent='Não foi possível consultar o pagamento agora. Guarde seu comprovante da InfinitePay.';}
})();
</script>
</body></html>
